</style></head><body><div class="page"><header class="intro"><div class="eyebrow">FOUNDER PITCH / STYLE STUDIO</div><h1>选一种属于你的路演风格</h1><p>8 种设计方向，也可以沿用自己产品的 UI。所有风格保持相同的内容颗粒度；先看效果，再决定。</p></header><div class="toolbar"><div class="tabs" role="group" aria-label="预览内容"><button data-view="solution" aria-pressed="true">看方案页</button><button data-view="tam" aria-pressed="false">看市场页</button></div><span class="hint">点击预览可放大 · 示例内容与测算仅用于比较风格</span></div><main class="grid" id="gallery"></main></div><div class="selection"><label for="request">选择后复制给 AI</label><textarea id="request" readonly placeholder="先选择一种风格"></textarea><button id="copy" disabled>复制一句话请求</button><span class="status" id="status" role="status"></span></div><dialog id="detail"><div class="dialog-top"><strong id="detail-title"></strong><button class="close" id="close" aria-label="关闭预览">×</button></div><div id="detail-preview"></div><div class="dialog-actions"><p>预览示例；最终会使用你项目里的真实内容</p><button class="pick" id="detail-pick">就选这个</button></div></dialog><script>const presets=[{"number": 1, "id": "studio-editorial-white", "name": "编辑部白", "tagline": "干净、清晰的现代产品路演", "layout": "balanced", "radius": "16px", "shadow": "0 16px 36px #18385B12", "colors": {"background": "#F6F8FC", "ink": "#14243B", "muted": "#546781", "accent": "#3157D5", "panel": "#FFFFFF", "soft": "#EAF0FD", "line": "#D7E1F1", "focus": "#14243B", "focus_ink": "#FFFFFF"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "无衬线标题、轻边框、均衡网格、克制阴影", "avoid": "避免无意义大留白和整页卡片堆叠"}, {"number": 2, "id": "midnight-product-launch", "name": "午夜发布会", "tagline": "深色舞台，突出产品与关键数字", "layout": "stage", "radius": "16px", "shadow": "0 20px 40px #00000028", "colors": {"background": "#101827", "ink": "#F6F8FD", "muted": "#B4C1D5", "accent": "#98B7FF", "panel": "#19263B", "soft": "#223655", "line": "#344663", "focus": "#D8E5FF", "focus_ink": "#102037"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "深色背景、产品主视觉、亮色焦点、留出呼吸感", "avoid": "避免霓虹光晕、通篇发光边框和灰字难读"}, {"number": 3, "id": "future-lab", "name": "未来实验室", "tagline": "有秩序的科技感，突出过程与证据", "layout": "technical", "radius": "6px", "shadow": "none", "colors": {"background": "#F0F6F7", "ink": "#123237", "muted": "#4D6970", "accent": "#176675", "panel": "#FFFFFF", "soft": "#DCEBF0", "line": "#C0D5DA", "focus": "#123237", "focus_ink": "#FFFFFF"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "细线网格、小半径、标注与明确连接、清楚状态", "avoid": "避免假代码、装饰性技术仪表和复杂架构"}, {"number": 4, "id": "swiss-grid", "name": "瑞士网格", "tagline": "强对齐、清楚层级、利落的编辑设计", "layout": "swiss", "radius": "0px", "shadow": "none", "colors": {"background": "#FAF9F5", "ink": "#191A1B", "muted": "#606160", "accent": "#C73327", "panel": "#FFFFFF", "soft": "#F6E7E3", "line": "#D9D8D1", "focus": "#191A1B", "focus_ink": "#FFFFFF"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "硬朗网格、少量红色强调、直角、粗细字体对比", "avoid": "避免把所有字都加粗或把红色铺满页面"}, {"number": 5, "id": "warm-editorial", "name": "暖调杂志", "tagline": "温润、精致，适合生活与人文产品", "layout": "editorial", "radius": "4px", "shadow": "0 10px 24px #513A2A0A", "colors": {"background": "#F8F2E8", "ink": "#332A24", "muted": "#76624F", "accent": "#9C561E", "panel": "#FFFCF6", "soft": "#EEE0CA", "line": "#DCCEBA", "focus": "#513A2A", "focus_ink": "#FFF9ED"}, "heading_font": "Georgia,\"Songti SC\",\"Noto Serif CJK SC\",serif", "design": "克制衬线标题、纸感暖白、细线、图文编辑关系", "avoid": "避免复古花纹、手写贴纸、棕色低对比文字"}, {"number": 6, "id": "botanical-studio", "name": "自然工作室", "tagline": "安静、可信，适合健康与可持续主题", "layout": "organic", "radius": "22px", "shadow": "0 12px 28px #173B300C", "colors": {"background": "#F0F5F0", "ink": "#173B30", "muted": "#577060", "accent": "#276A4E", "panel": "#FBFEFB", "soft": "#DDEADF", "line": "#C5D8CD", "focus": "#173B30", "focus_ink": "#FFFFFF"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "柔和墨绿、舒展间距、圆润轮廓、统一细线图形", "avoid": "避免卡通叶片、装饰植物抢戏和无意义绿色"}, {"number": 7, "id": "cobalt-gallery", "name": "钴蓝展厅", "tagline": "鲜明、有力量，突出产品主张", "layout": "gallery", "radius": "10px", "shadow": "0 14px 30px #10236120", "colors": {"background": "#244BCC", "ink": "#FFFFFF", "muted": "#D7E1FF", "accent": "#FFF1B8", "panel": "#193DAE", "soft": "#3155C7", "line": "#829BED", "focus": "#FFF1B8", "focus_ink": "#244BCC"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "钴蓝大色面、暖白或浅金重点、简洁几何构图", "avoid": "避免高饱和色混用和海报化到无法承载论据"}, {"number": 8, "id": "monochrome-minimal", "name": "黑白精工", "tagline": "理性、克制，突出文字与产品本身", "layout": "mono", "radius": "2px", "shadow": "none", "colors": {"background": "#F5F5F4", "ink": "#181818", "muted": "#626262", "accent": "#181818", "panel": "#FFFFFF", "soft": "#E9E9E7", "line": "#D4D4D0", "focus": "#181818", "focus_ink": "#FFFFFF"}, "heading_font": "\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans CJK SC\",sans-serif", "design": "黑白灰、精确网格、细分隔线、字重与尺寸对比", "avoid": "避免只剩大字和空白，灰度也要有重点"}];
let view='solution',selected=null,detailStyle=null;
const gallery=document.getElementById('gallery'),dialog=document.getElementById('detail'),request=document.getElementById('request'),copy=document.getElementById('copy'),status=document.getElementById('status');
function content(style){const tam=view==='tam';return `<div class="preview-shell"><div class="mini-slide ${tam?'mini-tam':''}" data-theme="${style.id}" data-layout="${style.layout}"><header class="mini-head"><p class="mini-meta">示例产品 / ${tam?'市场潜力':'核心方案'}</p><h2>${tam?'从市场总量，估算<span> 10% 的收入情景</span>':'把照护要求，转成<span>每天能执行的任务</span>'}</h2></header><div class="mini-body">${tam?`<div class="formula"><p><b>100 万户</b><small>假设目标家庭</small></p><i>×</i><p><b>120 元 / 年</b><small>假设每户年费</small></p><i>=</i><p><b>1.2 亿元 / 年</b><small>示例年度 TAM</small></p></div><div class="market"><div class="share"><div class="donut"><b>10%</b></div><p>假设获得的份额<br>同价、全年付费</p></div><div class="amount"><p>年度 TAM × 10%</p><p class="number">1,200 <span>万元 / 年</span></p><p class="condition">条件情景，非收入预测</p></div></div>`:`<div class="flow"><div class="input"><strong>主人提供</strong><p>宠物资料</p><p>日常作息与要求</p></div><div class="arrow">→</div><div class="engine"><p class="ai">AI</p><strong>整理完整日程</strong><p>把要求排成每日任务</p></div><div class="arrow">→</div><div class="result"><strong>今日清单</strong><p>喂食 <span class="tick">✓</span></p><p>换水 <span class="tick">✓</span></p><p>清洁 <span class="tick">✓</span></p></div></div>`}</div><footer class="mini-footer">${tam?'虚构数值，仅作风格预览；不是项目市场数据':'同一内容，不同设计语言；不是实际产品截图'}</footer></div></div>`}
function fit(){document.querySelectorAll('.preview-shell').forEach(el=>{const slide=el.querySelector('.mini-slide');if(slide)slide.style.transform=`scale(${el.clientWidth/960})`})}
function choose(id){selected=id;const s=presets.find(x=>x.id===id);const name=s?s.name:'沿用产品 UI';request.value=id==='product-ui'?'请用 $pitch 读取当前项目的产品 UI 设计，沿用它的风格制作六页路演。':`请用 $pitch，采用「${name}」风格制作当前项目的六页路演。`;status.textContent=`已选：${name}`;copy.disabled=false;document.querySelectorAll('.card').forEach(el=>el.dataset.selected=el.dataset.id===id);try{localStorage.setItem('pitch-style-choice-v6',id)}catch(e){} }
function render(){gallery.innerHTML=presets.map(s=>`<article class="card" data-id="${s.id}" data-selected="${selected===s.id}"><button class="preview-button" data-open="${s.id}" aria-label="放大预览${s.name}">${content(s)}</button><div class="card-info"><div><h3>${s.number.toString().padStart(2,'0')} / ${s.name}</h3><p>${s.tagline}</p></div><button class="pick" data-pick="${s.id}">选这个</button></div></article>`).join('')+`<article class="product-card"><div class="product-visual"><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="12" y="12" width="56" height="42" rx="5"/><path d="M12 23h56M27 64h26M40 54v10M23 33h13v12H23zM43 34h15M43 43h11"/></svg></div><div class="product-copy"><h3>09 / 沿用我的产品 UI</h3><p>让 AI 读取项目里的产品设计，把你的颜色、字体、Logo 和视觉特点延续到路演。</p><small>先读取当前项目，再生成专属预览；这里尚未分析你的产品。</small></div><button class="pick" data-pick="product-ui">沿用我的产品</button></article>`;fit()}
gallery.addEventListener('click',e=>{const pick=e.target.closest('[data-pick]');if(pick){choose(pick.dataset.pick);return}const open=e.target.closest('[data-open]');if(open){detailStyle=presets.find(s=>s.id===open.dataset.open);document.getElementById('detail-title').textContent=detailStyle.number+' / '+detailStyle.name;document.getElementById('detail-preview').innerHTML=content(detailStyle);dialog.showModal();fit()}});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));render()});document.getElementById('close').onclick=()=>dialog.close();document.getElementById('detail-pick').onclick=()=>{choose(detailStyle.id);dialog.close()};copy.onclick=async()=>{try{if(!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(request.value);status.textContent='已复制，粘贴到 AI 聊天框即可'}catch(e){request.focus();request.select();status.textContent='请手动复制已选中的这句话'}};window.addEventListener('resize',fit);try{const saved=localStorage.getItem('pitch-style-choice-v6');if(saved==='product-ui'||presets.some(s=>s.id===saved))choose(saved)}catch(e){}render();
</script></body></html>
